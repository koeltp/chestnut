name: chestnut
description: "栗子记账 - 一款简洁精致的记账 App"
publish_to: 'none'

version: 1.1.1+5

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2
  # 本地数据库（drift 基于 SQLite，类型安全）
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.32
  # 直接使用 SQLite 连接：降级检测、备份快照、导入预检
  sqlite3: ^2.4.0
  # 备份文件的选择与保存（SAF）
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  # 图表（分类占比饼图、收支趋势折线图）
  fl_chart: ^1.0.0
  # 日期与数字格式化
  intl: ^0.20.2
  # CSV 导出
  csv: ^6.0.0
  share_plus: ^13.3.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  shared_preferences: ^2.5.5
  amap_map: ^1.0.15
  x_amap_base: ^1.0.3
  http: ^1.6.0
  # 生物识别（指纹/面容快捷解锁）
  local_auth: ^2.3.0
  # PIN 与安全答案的加盐哈希
  crypto: ^3.0.6
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  map_launcher: ^6.0.0
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0
  url_launcher: ^6.3.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # drift 代码生成
  drift_dev: ^2.28.0
  build_runner: ^2.7.1

  # 从 Logo 一键生成各平台桌面图标
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # 静态图片资源
  assets:
    - assets/images/

# 桌面图标生成配置（dart run flutter_launcher_icons）
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  min_sdk_android: 21
  # Android 8+ 自适应图标：Logo 作前景，米白底色与 Logo 色调一致
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: "assets/images/logo.png"
