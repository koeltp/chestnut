# 发版流水线：推 v* tag 自动出签名包并发布到本仓库 GitHub Releases
#
# 流程：tag → 版本一致性校验 → 还原密钥 → 构建 → 指纹校验 →
#       生成 latest.json（含 sha256/fileSize）→ 创建 Release 上传 APK + 清单
#
# 应用内更新从 GitHub 的 releases/latest/download/latest.json 固定直链
# 取清单（恒指向最新 Release），APK 下载直链由清单的 apkUrl 给出
#
# 前置 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64    jks 文件的纯 base64，本地 PowerShell 生成：
#                      [Convert]::ToBase64String([IO.File]::ReadAllBytes("android\chestnut-release.jks")) | Set-Clipboard
#                      （勿用 certutil -encode：输出带 BEGIN/END 头尾，会解码出坏文件）
#   KEYSTORE_PASSWORD  keystore 密码
#   KEY_ALIAS          别名（chestnut）
#   KEY_PASSWORD       key 密码
#
# 发版动作：改 pubspec version → commit → git tag -a v1.2.1 -m "更新说明…"
#           → git push origin v1.2.1；tag message 逐行成为应用内更新日志
name: Release

on:
  push:
    tags: ['v*']

# 创建 Release 与上传资产需要写权限（GITHUB_TOKEN，无需 PAT）
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: tag 与 pubspec 版本一致性校验
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=${PUBSPEC_VERSION%%+*}
          VERSION_CODE=${PUBSPEC_VERSION##*+}
          TAG_NAME=${GITHUB_REF_NAME#v}
          if [ "$TAG_NAME" != "$VERSION_NAME" ]; then
            echo "::error::tag v$TAG_NAME 与 pubspec version $PUBSPEC_VERSION 不一致，请修正后重打 tag"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 还原签名密钥（job 结束随 runner 销毁，不落盘不入库）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/chestnut-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=../chestnut-release.jks
          EOF

      - name: 构建 Gradle 网络环境（切回官方源 + 清除本地代理）
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle#services.gradle.org/distributions#' \
            android/gradle/wrapper/gradle-wrapper.properties
          # 本地 gradle.properties 显式配置 127.0.0.1 代理（Gradle JVM 不读
          # 系统代理），runner 上该端口无服务，所有 Gradle 请求都会
          # Connection refused——CI 直连官方源，清除代理行
          sed -i '/systemProp.http.proxyHost/d;/systemProp.http.proxyPort/d;/systemProp.https.proxyHost/d;/systemProp.https.proxyPort/d;/systemProp.http.nonProxyHosts/d' \
            android/gradle.properties

      # --split-per-abi：出单架构 APK。仅 --target-platform 不够——它只限
      # Flutter 自家产物（libflutter/libapp），管不住第三方 AAR 自带的多套
      # ABI so（高德 arm32 23MB、sqlite3 x64 等，白带 26.5MB）；split 机制
      # 按 ABI 真正拆包，所有 so（含 AAR）都被过滤。产物为
      # app-arm64-v8a-release.apk。注意：split 模式 versionCode 会自动
      # +2000（arm64 ABI 偏移），latest.json 须从产物读真实值
      - name: 构建 release APK
        run: set -o pipefail; flutter build apk --release --split-per-abi --target-platform android-arm64 2>&1 | tee build_log.txt
        # 产物大小记入日志，便于盯体积膨胀趋势
      - name: 记录产物大小
        if: success()
        run: du -h build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: 构建失败时输出日志尾部（转为错误注解，匿名 API 可读）
        if: failure()
        run: |
          tail -n 40 build_log.txt | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: 签名指纹校验（确认 CI 用的是发布 keystore 而非误录的其他文件）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android/chestnut-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -c "6D:8E:ED:05:1A:FD:97:86:EF:9C:8C:23:0F:D1:29:AE:2B:A5:F5:80"

      - name: 生成 latest.json（字段与 UpdateInfo.fromJson 对齐）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$APK")
          # split-per-abi 会给 versionCode 加 ABI 偏移（+2000），与 pubspec
          # 的构建号不同——用 aapt2 从产物读真实值，保证清单与 APK 一致
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          REAL_CODE=$("$AAPT2" dump badging "$APK" | grep -o "versionCode='[0-9]*'" | grep -o '[0-9]*')
          REAL_NAME=$("$AAPT2" dump badging "$APK" | grep -o "versionName='[^']*'" | sed "s/versionName='//;s/'$//")
          python3 - "$SHA256" "$FILE_SIZE" "$REAL_CODE" "$REAL_NAME" <<'EOF'
          import json, sys, datetime, os, urllib.request

          # 更新日志：从 GitHub API 直取 annotated tag 的 message。
          # tag push 事件下 checkout 的浅克隆场景里本地 git 不一定能看到
          # tag 对象（实测曾提取为空），API 是唯一可靠来源
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          headers = {'User-Agent': 'chestnut-release'}
          token = os.environ.get('GITHUB_TOKEN')
          if token:
              headers['Authorization'] = 'Bearer ' + token
          def api(path):
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  headers=headers,
              )
              return json.load(urllib.request.urlopen(req, timeout=15))
          notes = []
          ref = api('/git/ref/tags/' + tag)
          if ref.get('object', {}).get('type') == 'tag':
              obj = api('/git/tags/' + ref['object']['sha'])
              notes = [
                  line.strip()
                  for line in obj.get('message', '').splitlines()
                  if line.strip()
              ]

          sha256, file_size, version_code, version_name = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          manifest = {
              'versionCode': version_code,
              'versionName': version_name,
              'apkUrl': 'https://github.com/koeltp/chestnut/releases/download/v${{ env.VERSION_NAME }}/chestnut-${{ env.VERSION_NAME }}.apk',
              'sha256': sha256,
              'fileSize': file_size,
              'releaseNotes': notes,
              'publishedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
          }
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          # 更新日志同时作为 Release 页面正文，与 latest.json 同一事实源
          with open('release_body.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(notes))
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          EOF

      # 产物按版本号命名后随 Release 上传（GitHub 单资产上限 2GB，
      # APK 直链与 latest.json 中 apkUrl 的文件名保持一致）。
      # 另传固定名副本 chestnut-latest.apk：配合 releases/latest/download/
      # 固定直链，博客下载按钮恒指最新版，从此免维护
      - name: 重命名产物
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "chestnut-${{ env.VERSION_NAME }}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk chestnut-latest.apk

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: chestnut ${{ env.VERSION_NAME }}
          body_path: release_body.txt
          files: |
            chestnut-${{ env.VERSION_NAME }}.apk
            chestnut-latest.apk
            latest.json
