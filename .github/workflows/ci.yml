# CI：每次推送/PR 自动跑静态检查与全量测试
# 构建打包由 Release 流水线负责（release.yml，tag 推送触发，签名密钥走 Secrets）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 全量测试
        run: flutter test
