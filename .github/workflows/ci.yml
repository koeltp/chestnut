# CI：每次推送/PR 自动跑静态检查与全量测试
# 构建打包由 Release 流水线负责（release.yml，tag 推送触发，签名密钥走 Secrets）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # 本机若带着 PUB_HOSTED_URL=镜像 跑 pub get，会把 lock 改写成镜像源；
      # 在 CI 层拦下，避免人肉记忆兜底（历史上已发生过两次）
      - name: 校验依赖锁源为 pub.dev
        run: |
          if grep -q "pub.flutter-io.cn" pubspec.lock; then
            echo "::error::pubspec.lock 含镜像源，请还原为 pub.dev 后再推送"
            exit 1
          fi

      - name: 静态检查
        run: flutter analyze

      - name: 全量测试
        run: flutter test
